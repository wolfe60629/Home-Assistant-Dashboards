# Step 3: Enable HTTPS with your domain
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1  # Loopback address
    - ::1        # IPv6 loopback
    - 172.19.0.4 # Reverse Proxy
