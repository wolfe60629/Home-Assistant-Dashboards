- id: '1771692087798'
  alias: Auto Next View On Scroll
  description: ''
  triggers:
  - event_type: browser_mod_connected
    trigger: event
  actions:
  - data:
      code: "if (!window._autoNextViewInstalled) {\n  window._autoNextViewInstalled
        = true;\n\n  let triggered = false;\n\n  window.addEventListener(\"scroll\",
        () => {\n    const scrollPosition = window.innerHeight + window.scrollY;\n
        \   const bottom = document.body.offsetHeight - 5;\n\n    if (scrollPosition
        >= bottom && !triggered) {\n      triggered = true;\n\n      const path =
        window.location.pathname;\n      const match = path.match(/\\/lovelace\\/(\\d+)/);\n\n
        \     if (match) {\n        let currentView = parseInt(match[1]);\n        let
        nextView = currentView + 1;\n\n        // CHANGE THIS NUMBER\n        if (nextView
        > 3) {\n          nextView = 0;\n        }\n\n        window.history.pushState(null,
        \"\", `/lovelace/${nextView}`);\n        window.dispatchEvent(new Event(\"location-changed\"));\n
        \     }\n\n      setTimeout(() => {\n        triggered = false;\n      },
        2000);\n    }\n  });\n}\n"
    action: browser_mod.javascript
  mode: single
