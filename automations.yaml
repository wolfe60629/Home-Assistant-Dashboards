- id: '1749317419196'
  alias: 'Laundry Room: Washer Finished'
  description: ''
  triggers:
  - entity_id: sensor.at340891n_laundry_machine_state
    from: Run
    trigger: state
  actions:
  - target:
      entity_id: media_player.kitchen_echo_show
    data:
      volume_level: 0.6
    action: media_player.volume_set
  - data:
      message: Your washer has completed its cycle.
    action: notify.alexa_media_kitchen_echo_show
  - wait_for_trigger:
    - entity_id: switch.laundry_room_light
      to: 'on'
      trigger: state
    - entity_id: sensor.at340891n_laundry_machine_state
      to: Run
      trigger: state
    timeout: 00:20:00
    continue_on_timeout: true
  - condition: template
    value_template: '{{ wait.trigger is none or wait.trigger.entity_id != ''sensor.at340891n_laundry_machine_state''
      }}'
  - condition: template
    value_template: '{{ as_timestamp(states.switch.laundry_room_light.last_changed)
      < as_timestamp(finished_time) }}

      '
  - data:
      message: 'Reminder: Laundry might still be in the washer.'
    action: notify.alexa_media_kitchen_echo_show
  - wait_for_trigger:
    - entity_id: switch.laundry_room_light
      to: 'on'
      trigger: state
    - entity_id: sensor.at340891n_laundry_machine_state
      to: Run
      trigger: state
    timeout: 00:40:00
    continue_on_timeout: true
  - condition: template
    value_template: '{{ wait.trigger is none or wait.trigger.entity_id != ''sensor.at340891n_laundry_machine_state''
      }}'
  - condition: template
    value_template: '{{ as_timestamp(states.switch.laundry_room_light.last_changed)
      < as_timestamp(finished_time) }}

      '
  - data:
      message: 'Final reminder: Please remove the laundry from the washer.'
    action: notify.alexa_media_kitchen_echo_show
  - action: alexa_media.restore_volume
    metadata: {}
    data:
      entity_id: media_player.kitchen_echo_show
  variables:
    finished_time: '{{ now() }}'
    previous_volume: '{{ state_attr(''media_player.kitchen_echo_show'', ''volume_level'')
      }}'
  mode: restart
